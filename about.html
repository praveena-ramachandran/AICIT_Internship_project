<!DOCTYPE html>
<html lang="en">
<head>
   <style>
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      color: #333;
    }

    
    header {
      background-color: #1f1f1f;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      color: #fff;
      font-size: 30px;
      margin-bottom: 10px;
    }

    nav a {
      color: #ffcc00;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
      color: #fff;
    }

    
    main {
      padding: 40px 20px;
    }

    section {
      max-width: 800px;
      margin: auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    section h2 {
      font-size: 28px;
      color: #333;
      margin-bottom: 20px;
    }

    section p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    /* Footer */
    footer {
      background-color: #1f1f1f;
      color: #fff;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer p {
      font-size: 14px;
    }

    @media (max-width: 600px) {
      nav a {
        display: block;
        margin: 10px 0;
      }

      section {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>About Shripriti Musics</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="artists.html">Artists</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Our Story</h2>
      <p>
        Shripriti Musics is an initiative to celebrate musical creativity by showcasing original music from independent artists.
      </p>
    </section>
  </main>

  <footer>
    <p>© 2025 Shripriti Musics</p>
  </footer>
</body>
</html>
