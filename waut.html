<html>
<head>
<style>
  /* ===== Glassmorphism Card ===== */
.glass-card {
  background: rgba(255, 255, 255, 0.1); /* translucent */
  backdrop-filter: blur(10px); /* frosted glass effect */
  -webkit-backdrop-filter: blur(10px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  padding: 20px;
  margin: 20px;
  transition: transform 0.3s;
}

.glass-card:hover {
  transform: translateY(-5px);
}

/* ===== Neumorphism Buttons ===== */
.neumo-btn {
  background: #e0e0e0; /* base color */
  border-radius: 12px;
  box-shadow: 6px 6px 12px #bebebe, -6px -6px 12px #ffffff; /* soft extruded look */
  border: none;
  padding: 12px 25px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.neumo-btn:hover {
  box-shadow: inset 6px 6px 12px #bebebe, inset -6px -6px 12px #ffffff; /* pressed effect */
}

/* ===== Hero Section with Glassmorphism Overlay ===== */
.hero {
  position: relative;
  background: url('assets/images/banner.jpg') center/cover no-repeat;
  height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
}
.hero .hero-content {
  position: relative;
  text-align: center;
  color: #fff;
  z-index: 1;
}
.hero h1 {
  font-size: 3rem;
  margin-bottom: 20px;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
}
.hero p {
  font-size: 1.5rem;
  text-shadow: 1px 1px 6px rgba(0,0,0,0.5);
}

</style>
</head>
<!-- Hero Section -->
<section class="hero">
  <div class="hero-content glass-card">
    <h1>Welcome to Shripriti Musics</h1>
    <p>Discover the rhythm of your soul</p>
    <button class="neumo-btn">Explore Music</button>
  </div>
</section>

<!-- Music Cards Section -->
<div class="gallery">
  <div class="glass-card">
    <img src="assets/images/song1.jpg" alt="Song 1" style="width:100%; border-radius:12px;">
    <h3>Feel the Beat</h3>
    <audio controls style="width:100%;">
      <source src="assets/music/song1.mp3" type="audio/mp3">
    </audio>
  </div>
</div>
