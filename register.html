<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | Shripriti Musics</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand mx-auto" href="index.html">Shripriti Musics</a>
  </nav>
  <section class="d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 400px;">
      <h3 class="text-center mb-4">Register</h3>
      <form>
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" class="form-control" id="regName" required>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" class="form-control" id="regPassword" required>
        </div>
        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" class="form-control" id="regConfirmPassword" required>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Register</button>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login here</a></p>
      </form>
    </div>
  </section>
</body>
</html>
