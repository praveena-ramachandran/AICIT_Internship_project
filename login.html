<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Shripriti Musics</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <a class="navbar-brand mx-auto" href="index.html">Shripriti Musics</a>
  </nav>
  <section class="d-flex align-items-center justify-content-center" style="height: 90vh;">
    <div class="card p-4 shadow" style="width: 350px;">
      <h3 class="text-center mb-4">Login</h3>
      <form>
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" class="form-control" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" class="form-control" id="loginPassword" required>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Login</button>
        <p class="text-center mt-3">Don't have an account? <a href="register.html">Register here</a></p>
      </form>
    </div>
  </section>
</body>
</html>
